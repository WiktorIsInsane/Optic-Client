appId: com.optic.launcher
productName: Optic
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: resources/mc-pvp-java17
    to: mc-pvp-java17
  - from: resources/zulu-25
    to: zulu-25
  - from: resources/optic
    to: optic
  - from: resources/server-icons
    to: server-icons
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Stable name so https://github.com/WiktorIsInsane/Optic-Client/releases/latest/download/Optic-Setup.exe
  # always points at the newest installer.
  artifactName: Optic-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Optic
  uninstallDisplayName: Optic
  runAfterFinish: true
  # Keep accounts, settings and the game folder when the launcher is uninstalled or updated.
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerSidebar: null
publish:
  provider: github
  owner: WiktorIsInsane
  repo: Optic-Client
  releaseType: release
mac:
  target: dmg
linux:
  target: AppImage
