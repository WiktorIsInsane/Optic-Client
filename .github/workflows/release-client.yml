name: Release client runtime

on:
  workflow_dispatch:
  push:
    tags:
      - 'client-v*'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package locally (runtime required)
        run: |
          echo "Package the client from a machine that has an Optic/Lunar Remake install."
          echo "Use: npm run package:client -- --publish --release-tag v1.2.0"
          echo "Default runtime: %APPDATA%\.lunar-remake\versions\<latest>"
          echo "Zip name: Atlas-Client-{version}.zip on WiktorDvD/Atlas-Client"
          exit 0
